name: Android Emulator Test
on:
  workflow_dispatch:
  push:
    branches: [codex/prototype-b2-c3]
    paths:
      - 'android/**'
      - 'src/**'
      - 'scripts/device-smoke.mjs'
      - '.github/workflows/android-emulator.yml'
permissions:
  contents: read
concurrency:
  group: emulator-${{ github.ref }}
  cancel-in-progress: true
jobs:
  emulator-reliability:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_AVD_HOME: /home/runner/.android/avd
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --no-audit --no-fund
      - name: Build web app and sync
        run: |
          npm run build
          npx cap sync android
      - name: Install Android SDK tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          # dl.google.com 的仓库 XML 偶发截断,重试兜底
          ok=""
          for attempt in 1 2 3; do
            if "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
                 "system-images;android-35;google_apis;x86_64" \
                 "emulator" "platform-tools" > /tmp/sdkmanager.log 2>&1; then
              ok=1; break
            fi
            echo "sdkmanager 第 $attempt 次失败,重试…"; tail -5 /tmp/sdkmanager.log
            sleep 10
          done
          [ -n "$ok" ] || { echo "sdkmanager 三次失败"; cat /tmp/sdkmanager.log; exit 1; }
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
      - name: Boot headless emulator
        run: |
          test -e /dev/kvm && echo "KVM ok"
          sudo chmod 666 /dev/kvm 2>/dev/null || true
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd \
            -n test -k "system-images;android-35;google_apis;x86_64" -d pixel_6
          test -f "$ANDROID_AVD_HOME/test.ini" || { echo "AVD 创建失败"; ls -la "$ANDROID_AVD_HOME"; exit 1; }
          nohup emulator -avd test -no-window -no-audio \
            -no-boot-anim -gpu swiftshader_indirect -no-snapshot -memory 3072 \
            > /tmp/emulator.log 2>&1 &
          # 快速失败:最多 3 分钟内模拟器必须出现在 adb 设备列表,否则带证据退出
          seen=""
          for i in $(seq 1 36); do
            if adb devices | grep -q "emulator-"; then seen=1; break; fi
            sleep 5
          done
          if [ -z "$seen" ]; then
            echo "模拟器进程未注册到 adb,启动即失败"
            ps aux | grep -v grep | grep emulator || echo "(无 emulator 进程)"
            cat /tmp/emulator.log
            exit 1
          fi
          timeout 60 adb wait-for-device
          boot=""
          for i in $(seq 1 120); do
            boot=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            [ "$boot" = "1" ] && break
            sleep 5
          done
          if [ "$boot" != "1" ]; then echo "模拟器未完成启动"; tail -30 /tmp/emulator.log; exit 1; fi
          echo "模拟器启动完成"
      - name: Build, install APK, grant permissions
        run: |
          chmod +x android/gradlew
          android/gradlew -p android assembleDebug --no-daemon
          adb install -r android/app/build/outputs/apk/debug/app-debug.apk
          adb shell pm grant io.zibloo.app android.permission.POST_NOTIFICATIONS || true
          adb shell appops set io.zibloo.app SCHEDULE_EXACT_ALARM allow || true
      - name: Launch app and forward WebView debug port
        run: |
          adb shell am start -n io.zibloo.app/.MainActivity
          sleep 8
          forward_app_page() {
            # WebView 各进程各有调试 socket,只有能列出应用页面的才是主进程
            for attempt in 1 2 3; do
              for s in $(adb shell cat /proc/net/unix | grep -o 'webview_devtools_remote_[0-9]*' | sort -u); do
                adb forward tcp:9222 localabstract:"$s" > /dev/null
                if curl -s http://127.0.0.1:9222/json | grep -q localhost; then return 0; fi
              done
              sleep 3
            done
            return 1
          }
          forward_app_page || { echo "未找到可用的 WebView 页面 target"; adb logcat -d | tail -50; exit 1; }
      - name: 'Phase A: 杀进程后提醒仍触发 (V2-lite)'
        run: |
          REMINDER_LABEL='冒烟A' REMINDER_MINUTES=1 node scripts/device-smoke.mjs
          adb shell input keyevent KEYCODE_HOME
          # am kill 只对已进 cached 态的进程生效,时序有抖动:重试直到确认死亡
          dead=""
          for i in $(seq 1 15); do
            sleep 3
            adb shell am kill io.zibloo.app > /dev/null 2>&1
            if ! adb shell pidof io.zibloo.app | grep -q .; then dead=1; break; fi
          done
          if [ -z "$dead" ]; then
            echo "进程未被杀掉"; adb shell dumpsys activity processes | grep -A2 zibloo | head -10; exit 1
          fi
          echo "进程已死,等待闹钟触发(最长 180s)…"
          for i in $(seq 1 60); do
            if adb shell dumpsys notification --noredact | grep -q "冒烟A"; then
              echo "V2-lite 通过:杀进程后提醒照响"
              adb exec-out screencap -p > artifacts-v2.png || true
              exit 0
            fi
            sleep 3
          done
          echo "V2-lite 失败:通知未出现"
          echo "--- 包状态(stopped/flags) ---"
          adb shell dumpsys package io.zibloo.app | grep -iE "stopped|flags=\[" | head -4 || true
          echo "--- 闹钟 ---"
          adb shell dumpsys alarm | grep -B2 -A5 zibloo || true
          echo "--- 广播投递历史 ---"
          adb shell dumpsys activity broadcasts | grep -B3 -A8 "ALARM_FIRED" | head -60 || true
          echo "--- 通知快照 ---"
          adb shell dumpsys notification --noredact | grep -B2 -A6 zibloo | head -30 || true
          exit 1
      - name: 'Phase B: 重启后从镜像重建 (V3-lite)'
        run: |
          adb shell cmd notification remove-all || true
          adb shell am start -n io.zibloo.app/.MainActivity
          sleep 8
          for attempt in 1 2 3; do
            for s in $(adb shell cat /proc/net/unix | grep -o 'webview_devtools_remote_[0-9]*' | sort -u); do
              adb forward tcp:9222 localabstract:"$s" > /dev/null
              if curl -s http://127.0.0.1:9222/json | grep -q localhost; then break 2; fi
            done
            sleep 3
          done
          REMINDER_LABEL='冒烟B' REMINDER_MINUTES=2 node scripts/device-smoke.mjs
          adb shell input keyevent KEYCODE_HOME
          for i in $(seq 1 15); do
            sleep 3
            adb shell am kill io.zibloo.app > /dev/null 2>&1
            if ! adb shell pidof io.zibloo.app | grep -q .; then break; fi
          done
          echo "重启设备,验证 BootReceiver 重建…"
          adb reboot
          adb wait-for-device
          boot=""
          for i in $(seq 1 120); do
            boot=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            [ "$boot" = "1" ] && break
            sleep 5
          done
          if [ "$boot" != "1" ]; then echo "重启后未完成启动"; exit 1; fi
          echo "重启完成,等待重建的闹钟触发(最长 180s)…"
          for i in $(seq 1 60); do
            if adb shell dumpsys notification --noredact | grep -q "冒烟B"; then
              echo "V3-lite 通过:重启后提醒从镜像重建并触发"
              adb exec-out screencap -p > artifacts-v3.png || true
              exit 0
            fi
            sleep 3
          done
          echo "V3-lite 失败"
          adb shell dumpsys alarm | grep -B2 -A5 zibloo || true
          exit 1
      - name: Save evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: emulator-evidence
          path: |
            artifacts-*.png
          retention-days: 7
          if-no-files-found: ignore
      - name: Save emulator log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: emulator-boot-log
          path: /tmp/emulator.log
          retention-days: 7
          if-no-files-found: ignore
      - name: Dump logcat on failure
        if: failure()
        run: |
          adb wait-for-device || true
          adb logcat -d > logcat.txt || true
      - name: Save logcat
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: emulator-logcat
          path: logcat.txt
          retention-days: 7
          if-no-files-found: ignore
