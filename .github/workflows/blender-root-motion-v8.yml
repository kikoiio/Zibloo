name: Blender soft arm bases and coordinated motion v8
on:
  push:
    branches: [codex/blender-flow-v2]
    paths:
      - 'prototype/scratch/blender-flow-v8/build.py'
      - 'prototype/scratch/blender-flow-v8/**'
      - '.github/workflows/blender-root-motion-v8.yml'
  workflow_dispatch:
    inputs:
      rendered_run:
        description: Reuse the rendered artifact from this run for viewer review
        type: string
        required: false
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: blender-root-motion-v8
  cancel-in-progress: false
jobs:
  model-and-review:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TMPDIR: ${{ github.workspace }}/.tmp
      OMP_NUM_THREADS: '2'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install official Blender on the cloud runner
        if: ${{ !inputs.rendered_run }}
        run: |
          mkdir -p "$TMPDIR" tools
          curl --fail --location --retry 2 https://download.blender.org/release/Blender4.5/blender-4.5.3-linux-x64.tar.xz -o tools/blender.tar.xz
          curl --fail --location --retry 2 https://download.blender.org/release/Blender4.5/blender-4.5.3.sha256 -o tools/blender.sha256
          cd tools
          expected=$(awk '$2 == "blender-4.5.3-linux-x64.tar.xz" {print $1}' blender.sha256)
          test -n "$expected"
          printf '%s  blender.tar.xz\n' "$expected" | sha256sum --check -
          tar -xf blender.tar.xz
          sudo apt-get update -qq
          sudo apt-get install -y libxrender1 libxi6 libxfixes3 libxkbcommon0 libsm6 libgl1
      - name: Download previous volume reference
        if: ${{ !inputs.rendered_run }}
        run: gh run download 40053382966 -R kikoiio/Zibloo -n blender-flow-v7 -D prototype/scratch/blender-flow-v8/previous
      - name: Build full gestures, expressive eyes and CPU previews
        if: ${{ !inputs.rendered_run }}
        run: tools/blender-4.5.3-linux-x64/blender -b -t 2 --python-exit-code 1 --python prototype/scratch/blender-flow-v8/build.py
      - name: Render previous model at the same true side camera
        if: ${{ !inputs.rendered_run }}
        run: tools/blender-4.5.3-linux-x64/blender -b -t 2 --python-exit-code 1 --python prototype/scratch/blender-flow-v8/render_baseline.py
      - name: Reuse completed renders for viewer review
        if: ${{ inputs.rendered_run }}
        env:
          RENDER_RUN: ${{ inputs.rendered_run }}
        run: gh run download "$RENDER_RUN" -R kikoiio/Zibloo -n blender-flow-v8 -D prototype/scratch/blender-flow-v8/output
      - name: Package animation previews and standalone viewer
        working-directory: prototype/scratch/blender-flow-v8
        run: |
          python3 -m venv "$TMPDIR/preview-python"
          "$TMPDIR/preview-python/bin/pip" install --disable-pip-version-check Pillow
          "$TMPDIR/preview-python/bin/python" package_output.py
          npm install --ignore-scripts --no-audit --no-fund
          node optimize.mjs
          python3 prepare_font.py
          npx esbuild viewer.js --bundle --format=esm --minify --outfile=output/viewer.js
      - name: Review the exported GLB in one cloud browser
        timeout-minutes: 6
        working-directory: prototype/scratch/blender-flow-v8
        run: |
          if ! command -v google-chrome >/dev/null 2>&1; then
            timeout --kill-after=10s 150s npx playwright install chromium --only-shell
          fi
          timeout --kill-after=10s 240s node browser-check.mjs
      - name: Preserve model, animations, screenshots and reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: blender-flow-v8
          path: prototype/scratch/blender-flow-v8/output/
          retention-days: 7
