name: Prototype review
on:
  push:
    branches: [codex/prototype-b2-c3]
    paths:
      - 'prototype/scratch/p0-v2/**'
      - 'prototype/verification/**'
      - '.github/workflows/prototype-review.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: prototype-review-${{ github.ref }}
  cancel-in-progress: false
jobs:
  browser-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: prototype/verification
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install cloud-only browser tools
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Install Chromium
        run: |
          npx playwright install --with-deps chromium
          test -n "$(fc-list :lang=zh family)"
          fc-list :lang=zh family | sort -u | head
      - name: Review layouts, motion, and user flows
        run: npm run review
      - name: Save screenshots and observations
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: prototype-review
          path: prototype/verification/artifacts/
          retention-days: 7
