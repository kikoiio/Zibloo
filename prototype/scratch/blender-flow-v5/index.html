<style>
@font-face{font-family:ZiblooReview;src:url(review-font.woff2);font-display:swap}
*{box-sizing:border-box}body{margin:0;background:#f3f0e8;color:#183d3b;font:16px/1.6 ZiblooReview,system-ui,sans-serif}main{max-width:1080px;margin:auto;padding:36px 24px}header{display:flex;justify-content:space-between;align-items:center;gap:20px}h1{font-size:28px;letter-spacing:-1px;margin:0}small,.note{color:#627d76}.stage{height:min(66vh,640px);min-height:330px;border-radius:32px;margin-top:24px;background:radial-gradient(ellipse at 50% 40%,#fffdf5,#e1e8dd);position:relative;overflow:hidden}canvas{display:block;width:100%;height:100%;touch-action:none}.status{position:absolute;bottom:12px;left:24px;font-size:13px;color:#55736d}.controls{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin:22px 0}button,a.link{border:1px solid #b9cec3;border-radius:24px;background:#fffdf5;color:inherit;padding:10px 22px;font:inherit;cursor:pointer}button[aria-pressed=true]{background:#236e69;color:white;border-color:#236e69}button:focus-visible,a:focus-visible{outline:3px solid #4aada3;outline-offset:3px}label{display:flex;align-items:center;gap:8px;justify-content:center}.note{text-align:center;font-size:14px}.downloads{display:flex;justify-content:center;flex-wrap:wrap;gap:12px;margin-top:22px}.link{text-decoration:none}.previews{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:34px}.previews img{width:100%;border-radius:16px}.previews a{color:inherit;text-decoration:none;font-size:14px;text-align:center}input{accent-color:#236e69}@media(max-width:600px){main{padding:20px 12px}header{display:block}h1{font-size:24px}.previews{grid-template-columns:repeat(2,1fr)}button{padding:10px 16px}}

<main>
<header><div><h1>zibloo · 立体体积 v5</h1><small>静候、招呼、专注与庆祝</small></div><small>拖动角色，观察侧面</small></header>

<button data-clip="Idle" aria-pressed="true">安静陪伴</button><button data-clip="Greeting" aria-pressed="false">招手问候</button><button data-clip="Focus" aria-pressed="false">专注托珠</button><button data-clip="Celebrate" aria-pressed="false">欢愉达成</button>
